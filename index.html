<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1116" />
  <title>PALIMPSEST — Thirteen Living Folios</title>
  <meta name="description" content="A continuous, interactive thirteen-folio sculptural pop-up book. Open directly onto the paper stage." />
  <script>
    // The Living Folios are the canonical entry experience; the original
    // historical reader remains available by explicit choice at archive.html.
    // Resolve relative to the current directory for GitHub Pages project URLs.
    (() => {
      const source = new URL(window.location.href);
      const archival = source.searchParams.get('edition') === 'archive';
      source.searchParams.delete('edition');
      const destination = new URL(archival ? './archive.html' : './folio-vnext.html', source.href);
      destination.search = source.search;
      destination.hash = source.hash;
      window.location.replace(destination.href);
    })();
  </script>
</head>
<body style="margin:0;min-height:100vh;background:#0e1116;color:#f0e8d9;font:16px/1.6 Georgia,serif">
  <noscript>
    <main style="padding:2rem">
      <h1>PALIMPSEST</h1>
      <p><a href="./folio-vnext.html" style="color:#9bd7ef">Open the thirteen Living Folios</a></p>
      <p><a href="./archive.html" style="color:#d3b587">Open the archival edition</a></p>
    </main>
  </noscript>
</body>
</html>
