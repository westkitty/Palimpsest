name: PALIMPSEST F01-F03 Development Checks

on:
  push:
    branches:
      - folio-vnext/f01-f03-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check entire application
        run: bun run lint
      - name: Preserve previous F01-F03 preview contract
        run: node tests/folio-vnext-preview.test.cjs
      - name: Verify review-preview geometry and hidden-testimony boundary
        run: node tests/preview-v2-contract.test.cjs
      - name: Verify bounded template logic and inspection gates
        run: bun test tests/folio-logic.test.mjs
      - name: Verify movable interface, papercraft and canon boundaries
        run: node tests/panel-layout-contract.test.cjs
      - name: Verify fold-to-cosmos signature and user agency
        run: node tests/awe-signature.test.cjs
      - name: Verify original authored figures, ink, color and source scope
        run: node tests/authored-assets-ink.test.cjs
      - name: Verify the joined twelve-folio living-volume navigation
        run: node tests/living-folios-bridge.test.cjs
      - name: Verify source-ink lineage and bounded study restoration
        run: bun test tests/folio-study-continuity.test.mjs
      - name: Build both PALIMPSEST pages
        run: bun run build
      - name: Verify both release artifacts are present
        run: test -s dist/index.html && test -s dist/folio-vnext.html
      - name: Prepare ephemeral Chromium smoke test
        run: |
          mkdir -p /tmp/palimpsest-e2e
          npm install --prefix /tmp/palimpsest-e2e --no-package-lock --ignore-scripts playwright
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Exercise the built 3D folio and original site
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/palimpsest-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          cp tests/browser-vnext-smoke.mjs /tmp/palimpsest-e2e/smoke.mjs
          PALIMPSEST_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" node /tmp/palimpsest-e2e/smoke.mjs

