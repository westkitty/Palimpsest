name: PALIMPSEST Living Twelve Development Checks

on:
  push:
    branches:
      - living-volume/full-twelve-20261120
      - uplift/living-theatre-20261120
      - feat/open-book-minimal-ui-20261120
      - fix/physical-book-gesture-20261120
      - feat/physical-theatre-restoration-20261120
      - feat/palimpsest-atmosphere-f13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: palimpsest-living-twelve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check full application
        run: bun run lint
      - name: Verify authored early folios and history
        run: |
          node tests/folio-vnext-preview.test.cjs
          node tests/preview-v2-contract.test.cjs
          bun test tests/folio-logic.test.mjs
          bun test tests/folio-study-continuity.test.mjs
      - name: Verify all twelve and physical scene contracts
        run: |
          bun test tests/living-twelve.test.mjs
          bun test tests/living-theatre.test.mjs
          bun test tests/great-misunderstanding.test.mjs tests/public-folio-map.test.mjs
          node tests/panel-layout-contract.test.cjs
          node tests/awe-signature.test.cjs
          node tests/authored-assets-ink.test.cjs
          node tests/living-folios-bridge.test.cjs
          node tests/book-first-ui.test.cjs
          node tests/physical-book-contract.test.cjs
          node tests/physical-theatre-restoration.test.cjs
      - name: Build both standalone and integrated routes
        run: |
          bun run build
          test -s dist/index.html && test -s dist/folio-vnext.html && test -s dist/archive.html && test -s dist/folio-vnext-classic.html
      - name: Setup Chromium
        run: |
          mkdir -p /tmp/palimpsest-e2e
          npm install --prefix /tmp/palimpsest-e2e --no-package-lock --ignore-scripts playwright
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Exercise the classic and public readers in built Chromium
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/palimpsest-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          cp tests/browser-vnext-smoke.mjs tests/browser-public-volume.mjs /tmp/palimpsest-e2e/
          export PALIMPSEST_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node /tmp/palimpsest-e2e/browser-vnext-smoke.mjs
          node /tmp/palimpsest-e2e/browser-public-volume.mjs
